name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Project information
        shell: bash
        run: |
          echo "========== JAVA =========="
          java -version

          echo "========== GRADLE =========="
          gradle --version

          echo "========== ANDROID =========="
          sdkmanager --list_installed | head -80 || true

          echo "========== PROJECT =========="
          find . -maxdepth 2 -type f | sort | head -150

      - name: Validate Gradle project
        shell: bash
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Release audit
        if: ${{ hashFiles('tools/release-audit.sh') != '' }}
        shell: bash
        run: |
          chmod +x tools/release-audit.sh
          TERM=xterm ./tools/release-audit.sh

      - name: Gradle dependency resolution
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:dependencies >/dev/null

      - name: Unit tests
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Android lint
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          mkdir -p release-output

          cp "$APK" \
            release-output/WA-Al-Othmany-Link-Bot-debug.apk

          sha256sum \
            release-output/WA-Al-Othmany-Link-Bot-debug.apk \
            | tee release-output/SHA256.txt

          echo
          echo "========== APK =========="
          ls -lh release-output/
          echo
          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Al-Othmany-Link-Bot-APK
          path: |
            release-output/WA-Al-Othmany-Link-Bot-debug.apk
            release-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
