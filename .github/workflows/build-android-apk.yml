name: WA Link Bot - Verify and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: wa-link-bot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dkotlin.daemon.jvm.options=-Xmx2g
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          chmod +x gradlew tools/bootstrap-gradle-wrapper.sh tools/verify-core.sh tools/release-audit.sh
          ./tools/bootstrap-gradle-wrapper.sh
          ./gradlew --version

      - name: Resolve app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Release audit
        shell: bash
        run: TERM=xterm ./tools/release-audit.sh

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build installable debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p release-output
          OUT="release-output/WA-Al-Othmany-Link-Bot-v${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          (cd release-output && sha256sum "$(basename "$OUT")" > SHA256.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Al-Othmany-Link-Bot-v${{ env.VERSION_NAME }}-APK
          path: |
            release-output/WA-Al-Othmany-Link-Bot-v${{ env.VERSION_NAME }}.apk
            release-output/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Link-Bot-Lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Link-Bot-Unit-Tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
