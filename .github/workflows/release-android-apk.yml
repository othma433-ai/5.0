name: WA Link Bot - Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dkotlin.daemon.jvm.options=-Xmx2g
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          chmod +x gradlew tools/bootstrap-gradle-wrapper.sh tools/verify-core.sh tools/release-audit.sh
          ./tools/bootstrap-gradle-wrapper.sh
          ./gradlew --version

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and app version
        shell: bash
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test "${GITHUB_REF_NAME}" = "v${VERSION_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${VERSION_NAME}" >&2
            exit 1
          }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Full release audit
        shell: bash
        run: TERM=xterm ./tools/release-audit.sh

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build installable APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/WA-Al-Othmany-Link-Bot-v${VERSION_NAME}.apk"
          (cd release-output && sha256sum "WA-Al-Othmany-Link-Bot-v${VERSION_NAME}.apk" > SHA256.txt)

      - name: Create GitHub Release
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-output/WA-Al-Othmany-Link-Bot-v${VERSION_NAME}.apk" \
            "release-output/SHA256.txt" \
            --title "WA Al-Othmany Link Bot v${VERSION_NAME}" \
            --notes-file "RELEASE_NOTES_v${VERSION_NAME}.md"
