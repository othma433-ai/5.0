name: WA Universal Adaptive - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-universal-adaptive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Android environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          sdkmanager --version
          sdkmanager --list_installed | head -100

      - name: Make scripts executable
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh 2>/dev/null || true

      - name: Show app version
        shell: bash
        run: |
          grep -nE 'versionCode|versionName' app/build.gradle.kts

      - name: Gradle wrapper check
        shell: bash
        run: |
          ./gradlew --version

      - name: Run unit tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Run lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      - name: Build APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p release-output

          cp "$APK" \
            "release-output/WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE.apk"

          sha256sum \
            "release-output/WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE.apk" \
            | tee release-output/SHA256SUMS.txt

          ls -lh release-output

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE
          path: |
            release-output/WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE.apk
            release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WA-Universal-Build-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
