name: WA Universal Adaptive - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-universal-adaptive-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Verify and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make scripts executable
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh 2>/dev/null || true

      - name: Show project version
        shell: bash
        run: |
          grep -nE 'versionCode|versionName' app/build.gradle.kts
          java -version

      - name: Gradle version
        shell: bash
        run: |
          ./gradlew --version

      - name: Unit Tests
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Android Lint
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:lintDebug

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p release-output

          cp "$APK" \
            release-output/WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE.apk

          sha256sum \
            release-output/WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE.apk \
            > release-output/SHA256SUMS.txt

          ls -lh release-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE
          path: |
            release-output/WA-Al-Othmany-v7.4.0-rc1-UNIVERSAL-ADAPTIVE.apk
            release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Universal-Test-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
